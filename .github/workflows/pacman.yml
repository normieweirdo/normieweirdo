name: Generate Pacman Graph

on:
  # Runs automatically every 24 hours
  schedule:
    - cron: "0 */24 * * *"
  
  # Allows you to manually trigger it
  workflow_dispatch:
  
  # Runs every time you push to the main branch
  push:
    branches:
    - master
    - main

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      # Generates the Pacman SVGs from your contribution history
      - name: generate pacman-contribution-graph.svg
        uses: platane/snk/svg-only@v3
        with:
          github_user_name: normieweirdo
          outputs: |
            dist/pacman-contribution-graph.svg?palette=pacman
            dist/pacman-contribution-graph-dark.svg?palette=pacman&color_snake=orange

      # Pushes the generated SVGs to a isolated branch named 'pacman-output'
      - name: push pacman-contribution-graph.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: pacman-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
